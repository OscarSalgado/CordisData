name: Fetch Calls

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch calls
        run: cordis-data fetch-calls
        continue-on-error: true

      - name: Check if data exists
        id: check
        run: |
          if [ -f data/calls.json ]; then
            echo "has_data=true" >> $GITHUB_OUTPUT
          else
            echo "has_data=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.has_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calls.json data/.metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update EU funding calls data [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          else
            echo "No changes in calls data"
          fi

      - name: Workflow summary
        run: |
          echo "## Calls Data Fetch" >> $GITHUB_STEP_SUMMARY
          if [ -f data/calls.json ]; then
            echo "Status: Success" >> $GITHUB_STEP_SUMMARY
            echo "Calls file size: $(wc -c < data/calls.json | numfmt --to=iec-i --suffix=B)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: Failed - calls.json not found" >> $GITHUB_STEP_SUMMARY
          fi
