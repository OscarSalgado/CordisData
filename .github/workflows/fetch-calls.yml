name: Fetch Calls

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Create data directory
        run: mkdir -p data logs

      - name: Fetch open calls with logging
        id: fetch_open
        run: |
          set -o pipefail
          echo "=== Starting open calls fetch ===" | tee -a logs/fetch-calls.log
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" | tee -a logs/fetch-calls.log
          echo "Python version: $(python --version)" | tee -a logs/fetch-calls.log
          echo "" | tee -a logs/fetch-calls.log

          if cordis-data fetch-open-calls --force 2>&1 | tee -a logs/fetch-calls.log; then
            echo "Open calls fetch completed successfully" | tee -a logs/fetch-calls.log
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "Open calls fetch failed" | tee -a logs/fetch-calls.log
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Fetch closed calls with logging
        id: fetch_closed
        run: |
          set -o pipefail
          echo "=== Starting closed calls fetch ===" | tee -a logs/fetch-calls.log

          if cordis-data fetch-closed-calls --force 2>&1 | tee -a logs/fetch-calls.log; then
            echo "Closed calls fetch completed successfully" | tee -a logs/fetch-calls.log
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "Closed calls fetch failed" | tee -a logs/fetch-calls.log
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Validate fetched data
        id: validate
        run: |
          echo "=== Data Validation ===" | tee -a logs/fetch-calls.log

          open_found=false
          closed_found=false

          if [ -f data/calls/open.jsonl.gz ]; then
            size=$(wc -c < data/calls/open.jsonl.gz)
            echo "calls/open.jsonl.gz exists" | tee -a logs/fetch-calls.log
            echo "  Size: $size bytes" | tee -a logs/fetch-calls.log
            open_found=true
          else
            echo "calls/open.jsonl.gz not found" | tee -a logs/fetch-calls.log
          fi

          if [ -f data/calls/closed.jsonl.gz ]; then
            size=$(wc -c < data/calls/closed.jsonl.gz)
            echo "calls/closed.jsonl.gz exists" | tee -a logs/fetch-calls.log
            echo "  Size: $size bytes" | tee -a logs/fetch-calls.log
            closed_found=true
          else
            echo "calls/closed.jsonl.gz not found" | tee -a logs/fetch-calls.log
          fi

          if [ "$open_found" = true ] || [ "$closed_found" = true ]; then
            echo "has_data=true" >> $GITHUB_OUTPUT
          else
            echo "has_data=false" >> $GITHUB_OUTPUT
          fi

          if [ -f data/.metadata.json ]; then
            echo "metadata.json exists" | tee -a logs/fetch-calls.log
            cat data/.metadata.json | tee -a logs/fetch-calls.log
          else
            echo "metadata.json not found" | tee -a logs/fetch-calls.log
          fi

      - name: Commit and push changes
        id: commit
        if: steps.validate.outputs.has_data == 'true'
        run: |
          echo "=== Git Operations ===" | tee -a logs/fetch-calls.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calls/open.jsonl.gz 2>/dev/null || true
          git add data/calls/closed.jsonl.gz 2>/dev/null || true
          git add data/.metadata.json 2>/dev/null || true
          git add data/calls/changelog/open/*.json 2>/dev/null || true
          git add data/calls/changelog/closed/*.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            message="chore(data): fetch calls (open and closed) [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git commit -m "$message" 2>&1 | tee -a logs/fetch-calls.log
            git push 2>&1 | tee -a logs/fetch-calls.log
            echo "Commit and push successful" | tee -a logs/fetch-calls.log
            echo "commit_status=pushed" >> $GITHUB_OUTPUT
          else
            echo "No changes in calls data" | tee -a logs/fetch-calls.log
            echo "commit_status=no_changes" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fetch-calls-logs
          path: logs/fetch-calls.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Workflow summary
        if: always()
        run: |
          echo "## Calls Data Fetch Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.fetch.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Validation**: $([ '${{ steps.validate.outputs.has_data }}' = 'true' ] && echo 'Valid' || echo 'Invalid')" >> $GITHUB_STEP_SUMMARY
          echo "**Git**: ${{ steps.commit.outputs.commit_status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Logs" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/fetch-calls.log ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat logs/fetch-calls.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "No logs captured" >> $GITHUB_STEP_SUMMARY
          fi
