name: Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy

      - name: Run flake8
        run: |
          echo "Running flake8..."
          flake8 src/ tests/ --config=.flake8
          echo "✓ Flake8 passed"

      - name: Run pyright
        run: |
          echo "Running pyright..."
          pyright src/ --outputjson > pyright-report.json
          python -c "import json; report = json.load(open('pyright-report.json')); errors = report.get('summary', {}).get('errorCount', 0); print(f'Pyright: {errors} errors, {report.get(\"summary\", {}).get(\"warningCount\", 0)} warnings'); exit(1) if errors > 0 else None"

      - name: Run mypy (static type checker)
        run: |
          echo "Running mypy..."
          mypy src/ --ignore-missing-imports --show-error-codes
          echo "✓ Mypy passed"

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            pyright-report.json
          retention-days: 30
